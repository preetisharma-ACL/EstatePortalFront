# Fails loudly when a URL in the sitemap stops being indexable.
#
# Guards the case the two-sided >=3 threshold can't guard itself against: someone
# editing MIN_INDEXABLE here or TYPE_PAGE_MIN_PROJECTS on the backend without the
# other, producing a sitemap entry for a noindex page. Also catches route
# renames, pages that start 404ing, and any future noindex rule.
#
# The backend command does the fetching; this only triggers it and reports.
# Deliberately NOT a full sweep: the validator SSR-renders every URL it checks,
# and we deploy far more often than Google crawls. Sampling per section catches
# what a deploy actually breaks; the droplet's nightly full run is the backstop.
name: Validate sitemap

on:
  # Vercel's GitHub integration posts this once a deployment is live, so the
  # check runs against the build that just shipped rather than the previous one.
  deployment_status:
  schedule:
    # Daily, offset from the backend's 03:23 cron so the two don't overlap.
    - cron: "40 22 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "URLs sampled per section (endpoint caps at 50)"
        default: "20"

concurrency:
  group: validate-sitemap
  cancel-in-progress: false

jobs:
  validate:
    # Skip preview deployments — they are not what the sitemap points at.
    # Vercel reports production as "Production"; the lowercase variant is
    # tolerated in case that ever changes.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment_status.environment == 'Production' ||
        github.event.deployment_status.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate sitemap URLs are reachable and indexable
        env:
          TOKEN: ${{ secrets.SITEMAP_VALIDATION_TOKEN }}
          # A deploy is a spot-check; the scheduled run samples wider.
          LIMIT: ${{ github.event.inputs.limit || (github.event_name == 'schedule' && '50' || '5') }}
        run: |
          set -uo pipefail

          if [ -z "${TOKEN}" ]; then
            echo "::error::SITEMAP_VALIDATION_TOKEN is not set. Add it under" \
                 "Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Sampling ${LIMIT} URLs per sitemap section..."

          # Body and status captured separately rather than using --fail, which
          # discards the body — and the body is the only place the failing URLs
          # appear. Without it a red job says "something broke" and nothing else.
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
                   --max-time 300 --retry 2 --retry-connrefused \
                   -X POST \
                   -H "X-Sitemap-Validation-Token: ${TOKEN}" \
                   "https://api.realestate.aajneeti.social/internal/validate-sitemap/?limit=${LIMIT}")

          echo "HTTP ${code}"
          cat "$body"
          echo

          case "$code" in
            200) echo "::notice::All sampled sitemap URLs are reachable and indexable." ;;
            503) echo "::error::A sitemap URL is unreachable or noindexed — see the failures above." ; exit 1 ;;
            403) echo "::error::Rejected by the validator (403). SITEMAP_VALIDATION_TOKEN is wrong or missing." ; exit 1 ;;
            *)   echo "::error::Unexpected response ${code} from the validator." ; exit 1 ;;
          esac
